# SPDX-License-Identifier: 0BSD
image: debian/sid
packages:
  - clang
  - lld
  - pkgconf
  - libarchive-dev
  - libfuse3-dev
  - fuse3
tasks:
  - build-gcc: |
      make -C archivemount-ng all check
      make -C archivemount-ng clean
  - build-clang: |
      export CC=clang CXX=clang++ LDFLAGS=-fuse-ld=lld
      make -C archivemount-ng all check
  - install: |
      sudo gmake -C archivemount-ng install
  - void: |
      curl https://repo-default.voidlinux.org/live/current/sha256sum.txt | grep -w tar | grep -w x86_64 | grep -m1 musl > sha256sum.txt
      curl -SL https://repo-default.voidlinux.org/live/current/"$(awk -F'[( )]' '{print $3}' < sha256sum.txt)" | tar -xJ
      cp /etc/resolv.conf etc
      printf '%s\n' 'xbps-install -yS' \
                    'xbps-install -yu xbps' \
                    'xbps-install -y make gcc pkgconf fuse3-devel libarchive-devel' \
                    'make -C archivemount-ng clean' \
                    'make -C archivemount-ng VERSION=sid.yml SOURCE_DATE_EPOCH=0' \
                    '#make -C archivemount-ng check' \
                    'make -C archivemount-ng install' \
                    '#archivemount archivemount-ng/text' |
        unshare -rR . sh -ex
